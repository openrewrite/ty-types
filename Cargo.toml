[package]
name = "ty-types"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "ty-types"
path = "src/main.rs"

[dependencies]
ty_project = { path = "ruff/crates/ty_project", default-features = false }
ty_python_semantic = { path = "ruff/crates/ty_python_semantic" }
ty_module_resolver = { path = "ruff/crates/ty_module_resolver" }
ty_python_core = { path = "ruff/crates/ty_python_core" }
ty_static = { path = "ruff/crates/ty_static" }
ruff_db = { path = "ruff/crates/ruff_db", default-features = false, features = ["os"] }
ruff_python_ast = { path = "ruff/crates/ruff_python_ast" }
ruff_text_size = { path = "ruff/crates/ruff_text_size" }

anyhow = "1.0"
rustc-hash = "2.0.0"
salsa = { git = "https://github.com/salsa-rs/salsa.git", rev = "53421c2fff87426fa0bb51cab06632b87646de13" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile to run tests under. See CLAUDE.md: Development Commands.
# The heavy dependencies stay optimized because the tests spawn the binary and
# run real inference against typeshed.
[profile.fast-test]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
lto = "off"

[profile.fast-test.package.salsa]
opt-level = 3
[profile.fast-test.package.ruff_python_parser]
opt-level = 3
[profile.fast-test.package.ruff_python_ast]
opt-level = 3

[lints.clippy]
dbg_macro = "warn"
